<style>
:root{--blue:#4263eb;--bg:#f5f7fb;--ink:#182433;--muted:#667085;--line:#e8edf3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,"Segoe UI","Microsoft YaHei",sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}.sidebar{background:#172235;color:#c7d0df;padding:22px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;color:white;font-weight:700;font-size:19px;padding:4px 10px 28px}.mark{width:34px;height:34px;background:#526cf5;color:white;border-radius:10px;display:grid;place-items:center}.label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#75849c;padding:14px 12px 8px}.nav{width:100%;display:flex;gap:12px;align-items:center;padding:10px 12px;color:#aab6c8;background:none;border:0;border-radius:7px;text-align:left;margin:2px 0;font-size:13px}.nav i{font-size:17px}.nav:hover{background:#ffffff0d;color:white}.nav.active{background:#2b3a56;color:white;box-shadow:inset 3px 0 #8394ff}.side-bottom{margin-top:auto;padding:16px 9px 0;border-top:1px solid #ffffff17;font-size:11px;color:#8d9ab0;line-height:1.9}.connected{color:#8cdbad}.main{min-width:0}.topbar{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;color:#7a8495;font-size:12px}.topbar strong{color:#293448}.topright{display:flex;align-items:center;gap:18px}.avatar{width:30px;height:30px;border-radius:50%;background:#edf0ff;color:#4a5fd2;display:grid;place-items:center;font-weight:700}.content{max-width:1500px;margin:auto;padding:30px 32px}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.title h1{font-size:24px;font-weight:650;letter-spacing:-.5px;margin:0 0 5px}.title p{margin:0;color:#7d8798;font-size:13px}.actions{display:flex;gap:8px}.btn{border:1px solid #e0e5ed;background:white;color:#344054;border-radius:6px;padding:8px 12px;font-weight:550;font- border:1px solid #e8ecff;padding:11px;border-radius:6px;font-size:11px;line-height:1.6}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #e0e5ed;border-radius:6px;padding:8px 10px;background:#fff;color:#344054;font-size:12px}.toolbar input{width:250px}.table{width:100%;border-collapse:collapse}.table th{font-size:10px;color:#8b95a5;font-weight:600;text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table td{font-size:11px;padding:12px 10px;border-bottom:1px solid #eff1f5}.table tr:last-child td{border-bottom:0}.cell-name{font-size:12px;font-weight:600}.details-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.details-title{display:flex;align-items:center;gap:13px}.repo-mark{width:42px;height:42px;border-radius:8px;background:#eef1ff;color:#526be0;display:grid;place-items:center;font-size:19px}.details-title h1{font-size:21px;margin:0 0 4px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:18px 0 0}.tabs button{border:0;background:none;padding:0 0 11px;color:#778295;font-size:12px;cursor:pointer}.tabs button.on{color:#4263eb;border-bottom:2px solid #4263eb}.change{padding:12px 0;border-top:1px solid #eff1f5;display:flex;justify-content:space-between;font-size:12px}.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eff1f5;font-size:12px}.kv span:first-child{color:#8791a1}.setting{max-width:820px}.setting .panel{margin-bottom:14px}.setting p{color:#8993a3;font-size:12px;margin:7px 0 13px}.toast{position:fixed;right:25px;bottom:22px;background:#172235;color:white;padding:12px 16px;border-radius:7px;display:none;box-shadow:0 8px 28px #17223533;font-size:12px}@media(max-width:1050px){.shell{grid-template-columns:205px 1fr}.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.content{padding:24px}.repo{grid-template-columns:1.3fr .7fr 1fr auto}.repo-commit{display:none}}@media(max-width:760px){. </style><style>
/* shadcn/ui inspired tokens and component treatment */
:root{--blue:#18181b;--bg:#fafafa;--ink:#09090b;--muted:#71717a;--line:#e4e4e7}body{background:#fafafa;color:#09090b;font-family:Inter,ui-sans-serif,system-ui,"Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:-.01em}.sidebar{background:#fff;color:#52525b;border-right:1px solid #e4e4e7;box-shadow:none}.brand{color:#09090b;font-size:17px}.mark{background:#18181b;border-radius:7px}.label{color:#a1a1aa;font-size:10px;font-weight:600}.nav{color:#52525b;border-radius:6px;transition:background .14s,color .14s}.nav:hover{background:#f4f4f5;color:#18181b}.nav.active{background:#f4f4f5;color:#18181b;box-shadow:none;font-weight:600}.side-bottom{border-color:#e4e4e7;color:#71717a}.connected{color:#15803d}.topbar{background:#fff;border-color:#e4e4e7;color:#71717a}.topbar strong{color:#18181b}.avatar{background:#f4f4f5;color:#3f3f46;border:1px solid #e4e4e7}.content{padding-top:34px}.title h1{font-size:23px;font-weight:600;letter-spacing:-.8px}.title p{color:#71717a}.metric,.panel{border:1px solid #e4e4e7;border-radius:8px;box-shadow:0 1px 2px #00000008}.metric{padding:17px}.metric-head{color:#71717a}.metric-icon{background:#f4f4f5;color:#52525b;border-radius:6px}.metric strong{font-size:25px;font-weight:600;letter-spacing:-1px}.metric small{color:#71717a}.btn{background:#fff;border:1px solid #e4e4e7;color:#18181b;border-radius:6px;box-shadow:0 1px 2px #00000008;font-weight:500;transition:all .13s}.btn:hover{background:#f4f4f5;transform:none;box-shadow:0 1px 2px #00000010}.btn.primary{background:#18181b;color:#fafafa;border-color:#18181b;box-shadow:none}.btn.primary:hover{background:#27272a}.status{border:1px solid transparent;border-radius:5px;font-weight:500}.s-blue{background:#f4f4f5;border-color:#e4e4e7;color:#3f3f46}.s-amber{background:#fffbeb;border-color:#fef3c7;color:#a16207}.s-green{background:#f0fdf4;border-color:#dcfce7;color:#15803d}.s-red{background:#fef2f2;border-color:#fee2e2;color:#b91c1c}.repo{border-color:#f0f0f2}.repo:hover{background:#fafafa}.repo-name{font-weight:550;color:#18181b}.repo-path,.repo-commit{color:#71717a}.panel-head h2{font-weight:600;color:#18181b}.notice{background:#fafafa;color:#52525b;border-color:#e4e4e7;border-radius:6px}.table th{color:#71717a;border-color:#e4e4e7}.table td{border-color:#f0f0f2}.toolbar input,.toolbar select{border-color:#e4e4e7;border-radius:6px;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:#a1a1aa;box-shadow:0 0 0 3px #18181b12}.tabs button.on{color:#18181b;border-color:#18181b}.details-title h1{font-weight:600}.repo-mark{background:#f4f4f5;color:#3f3f46;border:1px solid #e4e4e7;border-radius:7px}.kv,.change{border-color:#f0f0f2}.kv span:first-child,.muted{color:#71717a}.toast{background:#18181b;border:1px solid #27272a;border-radius:7px}
+</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="mark"><i class="ti ti-git-branch"></i></div><span class="brand-name">RepoDesk</span></div><div class="label">工作空间</div><button class="nav active" data-page="overview"><i class="ti ti-layout-dashboard"></i><span>总览</span></button><button class="nav" data-page="projects"><i class="ti ti-folders"></i><span>全部项目</span></button><button class="nav" data-page="detail"><i class="ti ti-git-merge"></i><span>项目操作</span></button><div class="label" style="margin-top:18px">管理</div><button class="nav" data-page="history"><i class="ti ti-history"></i><span>操作记录</span></button><button class="nav" data-page="settings"><i class="ti ti-settings"></i><span>设置</span></button><div class="side-bottom"><span class="connected">● Git 环境已连接</span><br>演示数据 · Windows</div></aside><section class="main"><header class="topbar"><div>工作空间　/　<strong id="crumb">总览</strong></div><div class="topright"><span>最近检查　今天 10:42</span><div class="avatar">M</div></div></header><main class="content" id="content"></main></section></div><div class="toast" id="toast"></div>
<script>
const data=[['RepoDesk','E:/Git/RepoDesk','main','3 个文件已修改','待推送','↑ 2','优化项目列表交互','12 分钟前','blue'],['client-portal','E:/Git/client-portal','develop','工作区干净','远程有更新','↓ 3','更新用户中心页面','2 小时前','amber'],['api-service','E:/Git/api-service','main','工作区干净','已同步','—','修复接口超时问题','昨天','green'],['design-system','E:/Git/design-system','feature/ui','2 个文件已修改','分支已分叉','↑ 1 ↓ 2','添加基础组件','昨天','red'],['developer-tools','E:/Git/developer-tools','main','工作区干净','已同步','—','更新项目文档','3 天前','green']];let page='overview',pick=0,filter='全部状态',search='',tab='文件改动';const names={overview:'总览',projects:'全部项目',detail:'项目操作',history:'操作记录',settings:'设置'};const btn=(x,c='')=>`<button class="btn ${c}" onclick="toast('${x}')">${x}</button>`;function toast(x){let t=document.querySelector('#toast');t.textContent='演示原型：'+x+'（未连接真实 Git）';t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function go(x){page=x;draw()}function badge(r){return `<span class="status s-${r[8]}">${r[4]}</span>`}function row(r,i){return `<div class="repo"><div><div class="repo-name">${r[0]}</div><div class="repo-path">${r[1]}</div></div><div class="branch">⑂ ${r[2]}</div><div class="work muted">${r[3]}</div><div>${badge(r)} <span class="muted">${r[5]}</span></div><button class="btn sm" onclick="pick=${i};go('detail')">查看</button></div>`}function overview(){return `<div class="title"><div><h1>总览</h1><p>所有项目的 Git 状态，一目了然。</p></div><div class="actions">${btn('刷新全部')}${btn('全部更新','primary')}</div></div><div class="metrics">${[['全部项目','5','已发现的仓库','ti-folders'],['待推送','1','本地有新提交','ti-arrow-up'],['远程更新','1','可拉取远程提交','ti-cloud-down'],['需要关注','1','分支需要处理','ti-alert-triangle']].map((x,i)=>`<div class="metric"><div class="metric-head">${x[0]}<span class="metric-icon"><i class="ti ${x[3]}"></i></span></div><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div><div class="layout"><section class="panel"><div class="panel-head"><h2>需要关注</h2><a onclick="go('projects')">全部项目 <i class="ti ti-arrow-right"></i></a></div>${data.map(row).join('')}<div class="notice"><i class="ti ti-info-circle"></i> 全部更新会先检查仓库；未提交修改、分叉或冲突风险的项目会跳过并说明原因。</div></section><aside class="panel"><div class="panel-head"><h2>最近活动</h2><a onclick="go('history')">查看记录</a></div><div class="feed"><b>✓　刷新全部项目</b><small>今天 10:42 · 5 个项目已检查</small></div><div class="feed"><b>↑　推送 api-service</b><small>昨天 18:30 · 推送成功</small></div><div class="feed"><b>↓　更新 client-portal</b><small>昨天 09:15 · 拉取成功</small></div><div class="notice">项目目录<br><b>E:/Git</b><br>共发现 5 个仓库</div></aside></div>`}function projects(){return `<div class="title"><div><h1>全部项目</h1><p>搜索、筛选并批量管理本地仓库。</p></div><div class="actions">${btn('刷新')}${btn('批量拉取')}${btn('批量推送','primary')}</div></div><div class="panel"><div class="toolbar"><input placeholder="⌕ 搜索名称或路径" value="${search}" oninput="search=this.value;draw()"><select onchange="filter=this.value;draw()">${['全部状态','待推送','远程有更新','已同步','分支已分叉'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`)}</select></div><table class="table"><thead><tr><th><input type="checkbox"></th><th>项目</th><th>分支</th><th>工作区</th><th>远程状态</th><th>最近提交</th><th></th></tr></thead><tbody>${data.map((r,i)=>({r,i})).filter(({r})=>(filter==='全部状态'||r[4]===filter)&&r.slice(0,2).join(' ').toLowerCase().includes(search.toLowerCase())).map(({r,i})=>`<tr><td><input type="checkbox"></td><td><div class="cell-name">${r[0]}</div><div class="repo-path">${r[1]}</div></td><td>⑂ ${r[2]}</td><td>${r[3]}</td><td>${badge(r)} ${r[5]}</td><td>${r[6]}<div class="repo-path">${r[7]}</div></td><td><button class="btn sm" onclick="pick=${i};go('detail')">打开</button></td></tr>`).join('')}</tbody></table></div>`}
function detail(){let r=data[pick];return `<div class="details-head"><div class="details-title"><div class="repo-mark"><i class="ti ti-brand-github"></i></div><div><h1>${r[0]}</h1><div class="repo-path">${r[1]}　·　⑂ ${r[2]}</div></div></div><div class="actions">${btn('打开目录')}${btn('拉取')}${btn('推送','primary')}</div></div><div class="layout"><div><div class="panel"><div class="panel-head"><h2>仓库状态</h2>${badge(r)}</div><div class="kv"><span>工作区</span><b>${r[3]}</b></div><div class="kv"><span>与远程比较</span><b>${r[5]}</b></div><div class="kv"><span>跟踪分支</span><b>origin/${r[2]}</b></div></div><div class="tabs">${['文件改动','分支','提交记录'].map(x=>`<button class="${x===tab?'on':''}" onclick="tab='${x}';draw()">${x}</button>`).join('')}</div><div class="panel">${tab==='文件改动'?`<div class="panel-head"><h2>工作区改动</h2>${btn('暂存全部','sm')}</div><div class="change"><span><b>src / app.js</b>　<span class="muted">已修改 · 尚未暂存</span></span>${btn('查看差异','sm')}</div><div class="change"><span><b>README.md</b>　<span class="muted">已修改 · 已暂存</span></span>${btn('查看差异','sm')}</div>`:`<div class="panel-head"><h2>${tab}</h2>${btn('查看全部','sm')}</div><div class="change"><b>${r[6]}</b><span class="muted">a18f3c2 · ${r[7]}</span></div>`}</div></div><aside class="panel"><div class="panel-head"><h2>项目信息</h2></div><div class="kv"><span>远程</span><b>origin</b></div><div class="repo-path">github.com/example/${r[0]}.git</div><div class="kv"><span>提交身份</span><b>继承全局</b></div><div class="notice">提交身份用于记录作者；远程认证由本机 Git 管理。</div></aside></div>`}
function history(){return `<div class="title"><div><h1>操作记录</h1><p>查看仓库操作和批量任务结果。</p></div>${btn('刷新记录')}</div><div class="panel"><table class="table"><thead><tr><th>时间</th><th>操作</th><th>项目</th><th>结果</th><th>详情</th></tr></thead><tbody><tr><td>今天 10:42</td><td>刷新全部</td><td>5 个项目</td><td><span class="status s-green">完成</span></td><td>5 成功</td></tr><tr><td>昨天 18:30</td><td>推送</td><td>api-service</td><td><span class="status s-green">成功</span></td><td>已推送 1 个提交</td></tr><tr><td>昨天 09:15</td><td>全部更新</td><td>5 个项目</td><td><span class="status s-amber">部分跳过</span></td><td>3 成功 · 2 跳过</td></tr></tbody></table></div>`}
function settings(){return `<div class="title"><div><h1>设置</h1><p>管理仓库扫描和默认 Git 提交身份。</p></div></div><div class="setting"><div class="panel"><div class="panel-head"><h2>项目目录</h2>${btn('管理目录','sm')}</div><p class="muted">RepoDesk 在配置的目录中发现 Git 仓库。</p><div class="kv"><span>扫描位置</span><b>E:/Git</b></div><div class="kv"><span>子目录扫描</span><b>已开启 · 最多 3 层</b></div><div class="kv"><span>排除目录</span><b>node_modules</b></div></div><div class="panel"><div class="panel-head"><h2>默认提交身份</h2>${btn('编辑','sm')}</div><div class="kv"><span>名称</span><b>Ming</b></div><div class="kv"><span>邮箱</span><b>ming@example.com</b></div></div><div class="panel"><div class="panel-head"><h2>检查偏好</h2></div><div class="kv"><span>启动时检查远程状态</span><b>已开启</b></div><div class="kv"><span>Git 路径</span><b>C:/Program Files/Git/bin/git.exe</b></div></div></div>`}function draw(){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));document.querySelector('#crumb').textContent=names[page];document.querySelector('#content').innerHTML=({overview,projects,detail,history,settings})[page]()}document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>go(x.dataset.page));draw();
</script></body></html>
